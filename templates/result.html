<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediction Result</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 80px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .result {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
        }

        .confidence {
            font-size: 20px;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 12px 25px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Startup Prediction Result</h1>

        <div class="result">
            {{ prediction }}
        </div>

        <div class="confidence">
            Confidence: {{ confidence }}%
        </div>

        <a href="/">
            Predict Another Startup
        </a>

    </div>

</body>

</html>
